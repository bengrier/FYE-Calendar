# Cloudflare Pages project for the First-Year Engineering Calendar.
#
# The site is the static files in public/; the API is Pages Functions in
# /functions, which deploy with the same push and share the origin — so there is
# one deployment, not two, and no CORS to configure.
#
# Only public/ is served. That is the reason for the directory: with the repo
# root as the output, wrangler.toml, schema.sql and seed.sql were all fetchable
# on the live site. Anything that is not meant to be downloadable by a stranger
# belongs outside public/.
#
# Local development:
#   npx wrangler d1 execute fye-calendar --local --file=schema.sql
#   npx wrangler d1 execute fye-calendar --local --file=seed.sql
#   npx wrangler pages dev public
#
# The IDs below are filled in by `wrangler d1 create fye-calendar`. Local
# development works without them; deploying does not.

name = "fye-calendar"
compatibility_date = "2026-08-08"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "fye-calendar"
database_id = "1de35f80-ffcd-4afa-b5de-c8570b3f3053"

[[r2_buckets]]
binding = "FLYERS"
bucket_name = "fye-calendar-flyers"

[vars]
# Cloudflare Access gates /review and /api/admin/* at the edge; the Functions
# verify the Access JWT as well, so a request that reaches them another way is
# still refused. While these are unset the admin API refuses everything — it
# fails closed, never open.
#
# They live here rather than in the Pages dashboard because this file is the
# deployment's configuration: a wrangler.toml [vars] block overrides whatever
# the dashboard holds, so a value set there would be silently replaced on the
# next deploy and the queue would stay closed for no visible reason.
#
# Neither is a credential. The team domain is in the URL every approver visits,
# and the AUD is a public identifier for the application — Access publishes it
# in the query string of its own login redirect. What makes a token trustworthy
# is its signature, which is checked in _middleware.js against the team's JWKS.
ACCESS_TEAM_DOMAIN = "spring-sun-620e.cloudflareaccess.com"
ACCESS_AUD = "bb37e73ef092adb255287e8a4a7a92f5f30270ff806e59dab9c84e3af86d4d4a"

# The one hostname the Access application covers. The site also answers on
# calendar.fyetools.com, which Access cannot cover — that domain's DNS is at
# Hover, and an Access application needs a zone on this Cloudflare account.
# /review on any other hostname redirects here so a reviewer always lands
# somewhere they can actually sign in. The footer link in public/index.html
# points at this same host and has to move with it.
REVIEW_HOST = "fye-calendar.pages.dev"

# Local development cannot present an Access JWT, so admin routes are
# unreachable with the settings above. Put
#
#   DEV_UNSAFE_NO_AUTH = "1"
#
# in a `.dev.vars` file to work on them locally. That file is gitignored, and
# wrangler never uploads it — production variables come from the dashboard — so
# it cannot leak into a deployment. It is named to be alarming on purpose.
