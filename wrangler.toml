# Cloudflare Pages project for the First-Year Engineering Calendar.
#
# The site is the static files in public/; the API is Pages Functions in
# /functions, which deploy with the same push and share the origin — so there is
# one deployment, not two, and no CORS to configure.
#
# Only public/ is served. That is the reason for the directory: with the repo
# root as the output, wrangler.toml, schema.sql and seed.sql were all fetchable
# on the live site. Anything that is not meant to be downloadable by a stranger
# belongs outside public/.
#
# Local development:
#   npx wrangler d1 execute fye-calendar --local --file=schema.sql
#   npx wrangler d1 execute fye-calendar --local --file=seed.sql
#   npx wrangler pages dev public
#
# The IDs below are filled in by `wrangler d1 create fye-calendar`. Local
# development works without them; deploying does not.

name = "fye-calendar"
compatibility_date = "2026-08-08"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "fye-calendar"
database_id = "1de35f80-ffcd-4afa-b5de-c8570b3f3053"

[[r2_buckets]]
binding = "FLYERS"
bucket_name = "fye-calendar-flyers"

# Where the calendar's own usage numbers go. Workers Analytics Engine: the
# Functions write data points, and they are read back with SQL over the API.
#
# This exists because the analytics Cloudflare would normally give a site — the
# per-domain Traffic dashboard — is a zone feature, and this deployment has no
# zone, for the same reason Access cannot cover the public hostname and rate
# limiting had to become code. `fyetools.com` is registered at Hover.
#
# The Web Analytics beacon in public/index.html covers page views, and is a
# third-party script that ad blockers and campus filtering can silence without
# any sign that they have. This dataset is written from our own Functions on our
# own origin, so it cannot be blocked, and it answers questions the beacon
# cannot: which events get opened, what gets added to a calendar, which filters
# people actually use.
#
# Nothing written here identifies a person. There is no IP address, no user
# agent, no session or visitor id, and no search text — see the schema at the
# top of functions/_lib/metrics.js, which is the one place any of it is decided.
#
# Unlike D1 and R2 there is nothing to create first: the dataset appears the
# first time something is written to it. Nothing needs to exist for local
# development either. `wrangler pages dev` binds this locally and nothing it
# writes leaves the machine or reaches the real dataset, so a local run cannot
# put test traffic in the numbers; and the helper treats an absent or inert
# binding as "do not record", so a version of wrangler that does not offer one
# is not an error either.
#
# Data is kept three months, which is the same horizon as EVENT_RETENTION_MONTHS
# below and is not a coincidence worth relying on — Analytics Engine's retention
# is not configurable.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "fye_calendar"

[vars]
# Cloudflare Access gates /review and /api/admin/* at the edge; the Functions
# verify the Access JWT as well, so a request that reaches them another way is
# still refused. While these are unset the admin API refuses everything — it
# fails closed, never open.
#
# They live here rather than in the Pages dashboard because this file is the
# deployment's configuration: a wrangler.toml [vars] block overrides whatever
# the dashboard holds, so a value set there would be silently replaced on the
# next deploy and the queue would stay closed for no visible reason.
#
# Neither is a credential. The team domain is in the URL every approver visits,
# and the AUD is a public identifier for the application — Access publishes it
# in the query string of its own login redirect. What makes a token trustworthy
# is its signature, which is checked in _middleware.js against the team's JWKS.
ACCESS_TEAM_DOMAIN = "spring-sun-620e.cloudflareaccess.com"
ACCESS_AUD = "bb37e73ef092adb255287e8a4a7a92f5f30270ff806e59dab9c84e3af86d4d4a"

# The one hostname the Access application covers. The site also answers on
# calendar.fyetools.com, which Access cannot cover — that domain's DNS is at
# Hover, and an Access application needs a zone on this Cloudflare account.
# /review on any other hostname redirects here so a reviewer always lands
# somewhere they can actually sign in. The footer link in public/index.html and
# REVIEW_HOST in public/js/app.js — which sends a reviewer back to the public
# domain when they are done — both name this host and have to move with it.
REVIEW_HOST = "fye-calendar.pages.dev"

# How long an event stays on the calendar after it has happened. Past that, the
# event is deleted and any flyer uploaded for it is deleted from R2 — otherwise
# artwork accumulates in the bucket forever and is paid for forever.
#
# The sweep runs on submit and on approve, at most once every twelve hours,
# because Pages Functions have no scheduled handler to hang it on. Unset means
# three months.
#
# "0" keeps every event forever. It does not stop the rest of the sweep, which
# also collects a declined submission's flyer and any upload no submission ever
# claimed: neither was ever on the calendar, so keeping the calendar's history
# says nothing about them. functions/_lib/retention.js.
EVENT_RETENTION_MONTHS = "3"

# Local development cannot present an Access JWT, so admin routes are
# unreachable with the settings above. Put
#
#   DEV_UNSAFE_NO_AUTH = "1"
#
# in a `.dev.vars` file to work on them locally. That file is gitignored, and
# wrangler never uploads it — production variables come from the dashboard — so
# it cannot leak into a deployment. It is named to be alarming on purpose.
