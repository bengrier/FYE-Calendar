<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-Year Engineering Calendar · Walter Scott, Jr. College of Engineering</title>
<!--
  Description held back for now: it named Colorado State University, and the
  page is deliberately no longer dressed as a CSU site. Kept verbatim so it can
  go back the moment the office wants the page to say whose it is.

  <meta name="description" content="Events, workshops, club builds and industry nights for first-year engineering students at Colorado State University.">
-->
<!--
  Tab icon. The .ico is first and unconditional because that is the one every
  browser understands; a browser that prefers the .svg takes it and scales
  cleanly on a high-density display. The Apple touch icon is a separate raster
  because iOS ignores SVG and masks its own corners onto a full-bleed square.
  All three are built from public/favicon.svg — the commands are in README.
-->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <header class="csu-header">
    <div class="csu-header__bar csu-header__bar--tall">
      <h1 class="csu-header__title">First-Year Engineering Calendar</h1>
      <div class="csu-header__actions">
        <button type="button" class="btn-brand btn-brand--ghost" data-action="open-submit">Submit an Event</button>
        <button type="button" class="btn-brand btn-brand--solid" data-action="start-slideshow">Slide Show</button>
      </div>
    </div>

    <div class="csu-rule"></div>
  </header>

  <div class="page">

    <section class="showcase" data-showcase>
      <div class="showcase__stage" data-stage></div>

      <div class="showcase__meta">
        <div class="showcase__row">
          <div class="showcase__kicker" data-cur="org"></div>
          <div class="showcase__when" data-cur="when"></div>
        </div>
        <div class="showcase__row">
          <div class="showcase__title" data-cur="title"></div>
          <div class="showcase__place" data-cur="place"></div>
        </div>
      </div>

      <div class="showcase__countdown" data-countdown></div>

      <aside class="reel">
        <div class="kicker reel__label">Now showing · in order</div>
        <div class="reel__list" id="reel" data-reel="main"></div>
      </aside>
    </section>

    <section class="filters">
      <div class="filters__row">
        <label class="filters__search">
          <span class="visually-hidden">Search events</span>
          <input type="search" id="search" class="filters__input"
                 placeholder="Search events, clubs, tags…" autocomplete="off"
                 spellcheck="false">
        </label>
      </div>
      <div class="filters__row">
        <span class="filters__label">Filter</span>
        <div class="filters__row" id="filters"></div>
      </div>
    </section>

    <div class="rule-thick"></div>

    <div class="toolbar">
      <div class="toolbar__left">
        <div class="toolbar__steps">
          <button type="button" class="btn-step" data-action="prev" title="Previous" aria-label="Previous">&lsaquo;</button>
          <button type="button" class="btn-step" data-action="next" title="Next" aria-label="Next">&rsaquo;</button>
        </div>
        <div class="toolbar__range" data-range></div>
        <button type="button" class="btn-quiet" data-action="today">Today</button>
      </div>
      <div class="toolbar__right">
        <span class="toolbar__count" id="visible-count"></span>
        <button type="button" class="btn-quiet" data-action="download-view">Add to my calendar (.ics)</button>
        <div class="viewtoggle">
          <button type="button" class="viewtoggle__btn" data-action="view-week">Week</button>
          <button type="button" class="viewtoggle__btn" data-action="view-month">Month</button>
        </div>
      </div>
    </div>

    <div class="toolbar toolbar--sub" id="toolbar-sub" hidden>
      <span class="samplenote" id="sample-note" hidden></span>
      <span class="toast" id="toast" role="status" aria-live="polite" hidden></span>
    </div>

    <div class="rule-thin"></div>

    <div class="loadstate" id="loadstate" role="status" aria-live="polite" hidden></div>

    <div id="calendar"></div>

  </div>

  <!-- The office's way in. This is an absolute URL to another host on purpose:
       Cloudflare Access covers fye-calendar.pages.dev and cannot cover this
       domain, whose DNS is not on Cloudflare. A reviewer sent to /review here
       would reach the queue with no way to sign in.

       If the Access application ever moves to a different hostname, this link,
       REVIEW_HOST in wrangler.toml and REVIEW_HOST in public/js/app.js (which
       is how the review screen knows to send reviewers back here) all have to
       follow it. -->
  <footer class="sitefoot">
    <div class="rule-thin"></div>
    <div class="sitefoot__row">
      <span class="sitefoot__note">Walter Scott, Jr. College of Engineering · Colorado State University</span>
      <a class="sitefoot__link" href="https://fye-calendar.pages.dev/review">Review queue · office sign-in</a>
    </div>
  </footer>
</div>

<div id="overlays"></div>

<script src="js/dates.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ics.js"></script>
<script src="js/metrics.js"></script>
<script src="js/app.js"></script>

<!-- Cloudflare Web Analytics: page views, referrers, countries, browsers.
     Cookieless, and it stores nothing that identifies a person.

     The token is not a credential. It is a public site identifier that ships in
     the HTML of every page it measures, the same way ACCESS_AUD in wrangler.toml
     is a public identifier — anybody who views source has it. What it grants is
     the ability to send this site fake page views, not the ability to read the
     numbers.

     Two things to know before trusting what the dashboard says.

     It is loaded from static.cloudflareinsights.com, a third-party host, because
     the automatic same-origin version of this beacon is only available to a
     proxied zone and this domain is not one. So it is blocked by ad blockers,
     by Brave and by the DuckDuckGo extension, and it would have been blocked
     outright during the ten days CSU filtered this site. When it is blocked the
     page is unaffected and the numbers simply stop — silently. Treat the figure
     as a floor, never a count.

     What it cannot be blocked out of is /api/metric, which is same-origin and
     answers the questions this does not: which events people open, what gets
     added to a calendar, which filters get used. See public/js/metrics.js.

     Added by a line of script rather than written as a plain <script src>,
     which is the only change from the snippet Cloudflare hands out, and it buys
     one thing: silence on localhost. The site token is registered to the two
     real hostnames, so on a dev machine every report is refused by CORS — and
     the beacon reports on load and again on each web vital, which was around
     thirty console errors per page. A wall of red in local development is how
     people learn to ignore the console.

     If anything about this ever looks suspect, the plain tag is the fallback
     and it is one edit:

       <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"
               data-cf-beacon='{"token": "..."}'></script> -->
<script>
(function () {
  if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
  var s = document.createElement("script");
  s.type = "module";
  s.src = "https://static.cloudflareinsights.com/beacon.min.js";
  s.setAttribute("data-cf-beacon", '{"token": "b77cc80dc1944b30be25206186dd0115"}');
  document.head.appendChild(s);
})();
</script>
</body>
</html>
