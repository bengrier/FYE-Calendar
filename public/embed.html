<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-Year Engineering Calendar · what's coming up</title>
<!--
  The embed: the showcase on its own, sized to fill an iframe on somebody
  else's page. It is index.html with everything that is not the flyer taken
  away — no header, no filters, no grid, no toolbar, no overlays — and it runs
  the same js/app.js against what is left. `data-embed` on <body> is how that
  file knows which of the two pages it is on; see EMBED in js/app.js.

  Paste-in snippet, and the two things worth knowing before pasting it, are in
  README under "Embedding".

  Not indexed: every event on it is already on the calendar itself, and a
  second copy of the same content under a second URL is a page competing with
  the one people should land on.
-->
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..800;1,8..60,300..700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="embed" data-embed>

<div class="app">
  <div class="page page--embed">

    <section class="showcase showcase--embed" data-showcase>
      <div class="showcase__stage" data-stage></div>

      <div class="showcase__meta">
        <div class="showcase__row">
          <div class="showcase__kicker" data-cur="org"></div>
          <div class="showcase__when" data-cur="when"></div>
        </div>
        <div class="showcase__row">
          <div class="showcase__title" data-cur="title"></div>
          <div class="showcase__place" data-cur="place"></div>
        </div>
      </div>

      <div class="showcase__countdown" data-countdown></div>

      <aside class="reel">
        <div class="kicker reel__label">Coming up</div>
        <div class="reel__list" data-reel="main"></div>
      </aside>
    </section>

    <!-- The range label is painted by renderToolbar, which walks every
         [data-range] on the page; with no toolbar here to say which week is
         being shown, this is the only thing that does.

         The sample note is not decoration. While the calendar still holds
         placeholder events, a frame showing them with nothing saying so is an
         invitation to plan around an invented date on a page that is not even
         ours. It hides itself the moment the last placeholder is replaced. -->
    <div class="embed__foot">
      <span class="embed__range" data-range></span>
      <span class="samplenote" id="sample-note" hidden></span>
      <a class="sitefoot__link" href="https://calendar.fyetools.com/"
         target="_blank" rel="noopener">Full calendar</a>
    </div>

  </div>
</div>

<!-- Empty, and here on purpose: nothing on this page opens an overlay, but
     app.js reaches for this node as it loads and one empty div is cheaper than
     a guard that has to stay true. -->
<div id="overlays"></div>

<script src="js/dates.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ics.js"></script>
<script src="js/metrics.js"></script>
<script src="js/app.js"></script>

<!-- No Cloudflare Web Analytics beacon, unlike index.html. It is a third-party
     script, this page is a third party's frame already, and what it would
     count — a page view — is the one thing /api/metric records here anyway,
     same-origin and unblockable, as surface "embed". -->
</body>
</html>
