# Publish the site when somebody pushes to main.
#
# This exists to remove the last single-person dependency in the arrangement.
# Publishing *events* was solved by the server pass — a reviewer approves and it
# is live. Publishing *the site* was not: it took somebody with wrangler, the
# Cloudflare account and a checkout on their own laptop running a deploy by
# hand. Now a push does it.
#
# Why not Cloudflare's own Git integration: the dashboard's Connect-to-Git flow
# builds a *Worker*, and a Worker cannot run functions/ at all — file-based
# routing is a Pages feature. Attaching it would serve public/ perfectly and
# 404 the entire API. So the project stays a CLI-created Pages project and the
# deploy is driven from here instead, which needs nothing from the dashboard.
#
# Two secrets, both set in Settings → Secrets and variables → Actions:
#
#   CLOUDFLARE_API_TOKEN   — a scoped token, NOT a global API key. Create it at
#                            My Profile → API Tokens with the "Edit Cloudflare
#                            Workers" template, which carries the Pages write
#                            permission this needs.
#   CLOUDFLARE_ACCOUNT_ID  — Workers & Pages → Overview, right-hand column.
#
# Until both exist this workflow fails on every push, loudly, which is the right
# way round: a deploy that silently does nothing is how you end up believing the
# live site has a change it does not have.

name: Deploy

on:
  push:
    branches: [main]
    # Nothing outside these ever reaches the browser, so a Handoff.md edit
    # should not spend a deployment.
    paths:
      - "public/**"
      - "functions/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  # So a deploy can still be forced from the Actions tab — after changing a
  # dashboard variable, say, or to re-publish an unchanged tree.
  workflow_dispatch:

# A deploy is a whole-site upload, so two of them overlapping is a race with the
# live site as the prize. Queue them instead, and never cancel one in flight.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # `--branch cloudflare-backend` is NOT a git operation and does not mean
      # this deploys that branch. It is a label Cloudflare matches against the
      # project's production branch to decide whether the upload is production
      # or a preview. The bytes uploaded are whatever is checked out here, which
      # is main. Change this string and every deploy silently becomes a preview
      # nobody visits.
      #
      # wrangler reads pages_build_output_dir = "public" from wrangler.toml, so
      # only public/ is served and functions/ is compiled — no directory
      # argument, on purpose.
      # Pinned exactly, not to `wrangler@4`. npx satisfies a range from whatever
      # is already cached on the runner, and the first run of this workflow
      # quietly used 4.86.0 while this project is developed against 4.121.0. A
      # deploy tool that changes version by itself is a variable nobody wants in
      # the one command that publishes the site. Bump it deliberately.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.121.0 pages deploy --branch cloudflare-backend
