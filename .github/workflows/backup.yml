# Back up everything that exists only in the Cloudflare account, on a schedule.
#
# Two things live nowhere else: the D1 database — every submission and every
# approval — and the flyer artwork in R2 that submitters uploaded. The repo is
# cloned on several disks and could be re-hosted in an afternoon. Neither of
# those could.
#
# Pages Functions have no scheduled handler — that is a Worker feature, and this
# is a Pages project precisely because a Worker cannot run functions/ — so the
# schedule has to live outside Cloudflare. GitHub Actions is outside Cloudflare,
# which is also the point: a backup stored in the same account it insures
# against losing is not a backup.
#
# ── This is a rebuild kit, not just a database dump ──────────────────────────
#
# Decided 2026-08-12, when a second admin on the Cloudflare account was ruled
# out. With no second pair of hands on the account, the backup has to be
# sufficient on its own to stand the whole calendar up somewhere else, so it
# carries the uploaded flyers as well as the database. A dump that restores
# every event with its artwork missing is a bad surprise to find during the
# week you are already having.
#
# The keys are read out of the dump itself rather than by walking the bucket,
# so the artwork in the archive is exactly the artwork the rows in that same
# archive point at. Orphaned objects are deliberately not collected — the
# retention sweep exists to delete those, and a backup that faithfully preserved
# rubbish would only restore it.
#
# The seeded flyers (`peru`, `ispe`, …) are NOT here and do not need to be: they
# are committed files in public/flyers/, so the repo already holds them. Only
# `f-` keys are R2 objects.
#
# If the artwork cannot be fetched, the database is still exported, encrypted
# and uploaded — under the name `fye-calendar-backup-DATABASE-ONLY` rather than
# `fye-calendar-backup` — and the run is failed afterwards. So a red run here
# does not mean there is no backup, and an artifact named DATABASE-ONLY is not
# a rebuild kit: it will restore every event and submission with the uploaded
# artwork missing. Take the newest artifact named plain `fye-calendar-backup`
# for that.
#
# ── The archive is encrypted, and that is not decoration ─────────────────────
#
# This repository is PUBLIC, and the dump contains the name and real
# @colostate.edu address of every submitter whose event is *still in the queue*
# when the export runs. Deciding a submission erases both, so an archive holds
# only the pending ones rather than every student who has ever submitted — but
# "fewer addresses" is not "no addresses", and a Sunday export lands wherever
# the queue happens to be. Two consequences, both load-bearing:
#
#   1. Nothing is committed. Everything is written to the runner and uploaded as
#      an artifact; no step here writes into the working tree.
#   2. Artifacts are readable by anyone who can read the repository, and on a
#      public repository that is everyone. So the archive is encrypted before it
#      is uploaded, and the artifact is ciphertext.
#
# If this repository is ever made private, the encryption is still correct and
# costs nothing. Do not remove it on the grounds that the repo is private now —
# repositories get flipped back.
#
# Three secrets, in Settings → Secrets and variables → Actions:
#
#   CLOUDFLARE_API_TOKEN   — the same token the deploy workflow uses. It needs
#                            three permissions, all at Account level:
#                              Cloudflare Pages  → Edit   (the deploy)
#                              D1                → Edit   (the export; Edit
#                                                          rather than Read,
#                                                          since an export is a
#                                                          write to the API)
#                              Workers R2 Storage → Read  (the flyers)
#   CLOUDFLARE_ACCOUNT_ID  — 19afe22934d229971259f29ef3f7700f.
#   BACKUP_PASSPHRASE      — invent a long random one and put it in the office's
#                            password manager, NOT only in GitHub. A backup you
#                            cannot decrypt is not a backup, and GitHub will not
#                            show you this value again after you save it.
#
# ── Restoring ────────────────────────────────────────────────────────────────
#
# Download the artifact, unzip it, then:
#
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#     -pass pass:'THE PASSPHRASE' \
#     -in fye-calendar-YYYY-MM-DD.tar.gz.enc -out backup.tar.gz
#
#   tar -xzf backup.tar.gz
#
# openssl rather than gpg specifically so that line works on a stock Mac with
# nothing installed. It was checked, not assumed: a real archive encrypted by
# OpenSSL 3.6 was decrypted byte-identically by the LibreSSL 3.3 at
# /usr/bin/openssl that macOS ships, and a wrong passphrase fails loudly rather
# than producing plausible rubbish.
#
# That gives a `.sql` file and a `flyers/` directory. README's "Rebuilding from
# a backup" is the procedure for turning those into a running calendar on a
# different account.
#
# Worth reading it before trusting it. `sqlite3` over the .sql file and a count
# of the events and submissions tables takes a minute and is the only thing that
# actually proves a backup is a backup.

name: Backup database

on:
  schedule:
    # Sundays at 10:00 UTC — about 4am in Colorado either side of DST. The
    # export takes the database offline for the moment it runs, so this wants to
    # be an hour when nobody is submitting.
    - cron: "0 10 * * 0"
  workflow_dispatch:

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refuse to run without a passphrase
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        # Without this the encrypt step below would fail anyway, but it would
        # fail after the export, with a message about openssl rather than about
        # the missing secret. Fail first and name the secret.
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE is not set. The backup can hold real student email addresses and is not uploaded unencrypted."
            exit 1
          fi

      - name: Export the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Pinned exactly for the same reason as the deploy workflow: npx will
        # satisfy a range from whatever it finds cached on the runner.
        run: |
          npx --yes wrangler@4.121.0 d1 export fye-calendar --remote \
            --output="fye-calendar-$(date -u +%Y-%m-%d).sql"

      # A dump with no INSERTs is what a broken export looks like: the command
      # succeeds, the file exists, and it restores an empty calendar. Checking
      # afterwards is cheap; discovering it during a restore is not.
      - name: Check the dump is not empty
        run: |
          FILE="fye-calendar-$(date -u +%Y-%m-%d).sql"
          ROWS=$(grep -c "^INSERT INTO" "$FILE" || true)
          echo "$FILE — $(wc -c < "$FILE") bytes, $ROWS INSERT statements"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::Export contains no rows. Not uploading a backup that would restore an empty calendar."
            exit 1
          fi

      - name: Fetch the flyers those rows point at
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          FILE="fye-calendar-$(date -u +%Y-%m-%d).sql"
          mkdir -p flyers

          # The name the artifact is uploaded under, decided at the two points
          # below where this step can end. A database-only archive is given a
          # different name so it can never be mistaken for a whole one by
          # somebody grabbing the newest download.
          ARTIFACT="fye-calendar-backup"

          # `f-<base36 time>-<6 base36>.<ext>`, the format functions/_lib/http.js
          # uid() produces and functions/api/flyers.js appends a sniffed
          # extension to. Anchored on that shape so a stray word in a blurb can
          # never be mistaken for a key.
          KEYS=$(grep -oE "f-[0-9a-z]+-[0-9a-z]+\.(pdf|jpg|png|gif|webp)" "$FILE" | sort -u)

          if [ -z "$KEYS" ]; then
            # Complete by definition: no rows point at any R2 object, so an
            # archive with an empty flyers/ directory is the whole calendar.
            echo "No uploaded flyers are referenced. Nothing to fetch."
            echo "FLYER_COUNT=0" >> "$GITHUB_ENV"
            echo "ARTIFACT_NAME=$ARTIFACT" >> "$GITHUB_ENV"
            exit 0
          fi

          TOTAL=0; OK=0
          for KEY in $KEYS; do
            TOTAL=$((TOTAL + 1))
            if npx --yes wrangler@4.121.0 r2 object get "fye-calendar-flyers/$KEY" \
                 --remote --file="flyers/$KEY" >/tmp/r2.log 2>&1; then
              OK=$((OK + 1))
            else
              # One missing object must not cost the database backup. The
              # retention sweep can legitimately delete a flyer between the
              # export and this step, and a row can outlive its artwork.
              echo "::warning::Could not fetch $KEY — continuing without it."

              # Print what wrangler actually said. This used to go to
              # /dev/null, which meant the one run that needed diagnosing was
              # the one run with nothing to diagnose from: a missing object, an
              # expired token and a bad gateway all looked identical, and the
              # error message below had to guess between them. GitHub masks the
              # secrets in this output, and the account id is already in this
              # file, so there is nothing here to leak on a public repo.
              echo "--- wrangler said, fetching $KEY ---"
              cat /tmp/r2.log
              echo "--- end ---"
            fi
          done

          echo "Flyers: $OK of $TOTAL fetched."
          echo "FLYER_COUNT=$OK" >> "$GITHUB_ENV"

          # Every fetch failing is usually not a missing object, it is a broken
          # credential — most often the token lacking Workers R2 Storage → Read.
          # Silently shipping an artwork-less archive every week until somebody
          # needs one is the failure worth preventing, so the run still goes
          # red. But it goes red at the *end* now, after the upload.
          #
          # It failed here instead on 2026-08-16, and took a perfectly good
          # export down with it: 157 INSERT statements dumped, verified,
          # and then dropped on the floor because one PNG would not come back.
          # The flyer and the database fail independently and there is no
          # reason the second should be hostage to the first. Whatever is
          # wrong, a week-old dump is worse than a fresh one missing artwork.
          #
          # Note this test cannot tell "the credential is broken" from "the one
          # flyer we have was unlucky" while the calendar has a single upload in
          # it — 0 of 1 is both. That is the other reason not to spend the
          # database backup on it.
          if [ "$OK" -eq 0 ]; then
            echo "::warning::Every flyer fetch failed. Uploading the database on its own; this run will be failed at the end."
            echo "FLYERS_MISSING=1" >> "$GITHUB_ENV"
            ARTIFACT="fye-calendar-backup-DATABASE-ONLY"
          fi

          echo "ARTIFACT_NAME=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Bundle and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          STAMP="$(date -u +%Y-%m-%d)"
          FILE="fye-calendar-$STAMP.sql"

          tar -czf "fye-calendar-$STAMP.tar.gz" "$FILE" flyers
          rm -rf "$FILE" flyers

          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:BACKUP_PASSPHRASE \
            -in "fye-calendar-$STAMP.tar.gz" -out "fye-calendar-$STAMP.tar.gz.enc"
          # -pass env: rather than -pass pass:, so the passphrase is never a
          # word in a command line any other process on the runner could read.
          #
          # The plaintext never leaves this step. Every later step, and the
          # artifact, sees only the ciphertext.
          rm -f "fye-calendar-$STAMP.tar.gz"

          # Prove the file that is about to be uploaded actually opens. An
          # unverified backup is a guess, and this is the only moment the
          # passphrase and the ciphertext are ever in the same place.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE \
            -in "fye-calendar-$STAMP.tar.gz.enc" -out /tmp/verify.tar.gz

          tar -xzf /tmp/verify.tar.gz -C /tmp
          if ! grep -q "^INSERT INTO" "/tmp/$FILE"; then
            echo "::error::The encrypted backup did not decrypt back to readable SQL. Not uploading it."
            exit 1
          fi
          echo "Verified: decrypts to $(grep -c '^INSERT INTO' "/tmp/$FILE") INSERT statements and $FLYER_COUNT flyer(s)."
          rm -rf /tmp/verify.tar.gz "/tmp/$FILE" /tmp/flyers

      - uses: actions/upload-artifact@v4
        with:
          # `fye-calendar-backup`, or `fye-calendar-backup-DATABASE-ONLY` when
          # the flyers could not be fetched. Set in the fetch step. A partial
          # archive is worth keeping and worth never being handed to somebody
          # who asked for the latest backup, and the name is what separates
          # those two in the artifacts list.
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.tar.gz.enc"
          # 90 days — about thirteen weekly backups.
          #
          # This asked for 365 until 2026-08-17 and never once got it. GitHub
          # capped every upload at 90 and said so in a warning nobody was
          # reading, so the number here was aspiration and the artifacts had
          # been expiring at 90 days all along. Asking again would only bring
          # the warning back, so it now says what actually happens.
          #
          # The ceiling follows the repository being PUBLIC rather than the
          # plan: public repositories cap at 90 days, private ones allow up to
          # 400. If this repo is ever made private — see the note above about
          # the encryption staying either way — this can go up with it.
          #
          # What 90 days does and does not cover, since the original number was
          # chosen against a real worry: a rebuild reads the newest archive
          # only, so disaster recovery is untouched by this. What shortens is
          # how far back you can rewind after damage nobody noticed — and a
          # summer is about 90 days, which is the gap that motivated 365. See
          # README's "How far back you can go" for the ways to cover it, none
          # of which is this field.
          retention-days: 90
          if-no-files-found: error

      # Last, so that the archive above is safely uploaded before the run is
      # failed. Everything this step could have said was already said as a
      # warning; it exists to turn the run red and send the email.
      - name: Fail the run if the flyers are missing
        if: env.FLYERS_MISSING == '1'
        run: |
          echo "::error::Backup uploaded as fye-calendar-backup-DATABASE-ONLY — it holds the database but none of the flyer artwork. The wrangler output is in the fetch step above; check first whether the API token still has Account → Workers R2 Storage → Read. Until this passes again, the newest *complete* backup is an older one."
          exit 1
